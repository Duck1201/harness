[project]
name = "harness-2"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi==0.116.1",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "pydantic>=2.11.7",
    "tokenizers==0.21.4",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
